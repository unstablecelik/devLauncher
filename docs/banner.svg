<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b3a2f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="14" fill="url(#grid)"/>

  <!-- pixel-creeper-ish glyph -->
  <g transform="translate(74,96)" fill="none">
    <g fill="url(#accent)">
      <rect x="0"  y="0"  width="18" height="18" rx="2"/>
      <rect x="22" y="0"  width="18" height="18" rx="2"/>
      <rect x="44" y="0"  width="18" height="18" rx="2"/>
      <rect x="0"  y="22" width="18" height="18" rx="2"/>
      <rect x="44" y="22" width="18" height="18" rx="2"/>
      <rect x="0"  y="44" width="18" height="18" rx="2"/>
      <rect x="22" y="44" width="18" height="18" rx="2"/>
      <rect x="44" y="44" width="18" height="18" rx="2"/>
    </g>
  </g>

  <text x="180" y="150" font-family="JetBrains Mono, Consolas, monospace" font-size="64" font-weight="700" fill="#f8fafc">dev<tspan fill="url(#accent)">Launcher</tspan></text>
  <text x="184" y="196" font-family="JetBrains Mono, Consolas, monospace" font-size="22" fill="#94a3b8">fast-minimal Minecraft launcher · instances · mods · P2P multiplayer</text>
  <text x="184" y="232" font-family="JetBrains Mono, Consolas, monospace" font-size="17" fill="#64748b">vanilla · fabric · quilt · neoforge · forge</text>

  <rect x="944" y="118" width="196" height="46" rx="23" fill="rgba(16,185,129,0.15)" stroke="url(#accent)"/>
  <text x="1042" y="147" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="19" fill="#34d399">v0.13.0</text>
</svg>
